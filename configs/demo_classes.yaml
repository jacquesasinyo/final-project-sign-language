# Demo/application vocabulary (docs/decisions.md D-12). NOT the experimental benchmark:
# configs/classes.yaml (20 classes, seed 2026) and its results stay unchanged.
selection_rule: >-
  Curated for the live demo, chosen before any model was trained on these classes, from
  AUTSL training data only (no validation or test results). Kept: 13 benchmark classes
  that were not unreliable in the informal live try-out and do not resemble a new sign.
  Dropped: ben, mendil, tuvalet (failed live) and odun, hali, tarak, maas (the current
  classes the new signs most resemble). Added: 8 useful words, preferring two-handed
  signs with large movements, ranked by an exploratory landmark analysis of 10 train
  clips (10 signers) per candidate.
demo_phrase: "Selam! Yardım — hastane nerede? Tamam, teşekkür. Hoşçakal."
kept_from_benchmark: [26, 57, 107, 128, 140, 146, 153, 159, 165, 196, 198, 215, 220]
added: [15, 83, 93, 138, 173, 179, 186, 211]
